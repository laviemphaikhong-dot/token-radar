<title>Token Radar: pre-token protocols ranked by a fitted model, with launch odds</title>

<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<noscript><p>Token Radar (model radar-3): every protocol on the snapshot's watchlist, ranked by an implied value fitted from the snapshot's own traded tokens — a least-squares size curve of ln(market cap / TVL) on ln(TVL), a category tilt shrunk by n / (n + 10), a seven-day growth multiplier and a maturity multiplier — with launch odds as each listed-year cohort's already-tokenized share adjusted by category, an integrity screen that lists its rejects with reasons, and a costed farm plan per protocol. Validated over 200 seeded held-out splits of the traded comps: the full model's median log error beats the flat 0.25x multiple and the size curve alone; the figures ship in data.js beside the board. Enable JavaScript for the sortable board, filters and detail views.</p></noscript>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
