<title>Token Radar: pre-token protocols ranked by expected value, with launch odds and farm verdicts</title>
<link rel="stylesheet" href="app.css">

<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<noscript><p>Token Radar (model radar-4): every protocol on the snapshot's watchlist, ranked by expected value — an implied value from a size curve fitted on the snapshot's own traded tokens (least-squares of ln(market cap / TVL) on ln(TVL); the only term that survives leave-one-out and walk-forward validation, whose full term-by-term tables ship in data.js) times launch odds (a listed-year cohort's already-tokenized share adjusted by category, with a peer-group reading tested and not adopted), plus a farm verdict net of fees at a $1,000 ticket under a stated 5% drop-share assumption, and an integrity screen that lists its rejects with reasons. Enable JavaScript for the sortable board, filters and detail views.</p></noscript>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
